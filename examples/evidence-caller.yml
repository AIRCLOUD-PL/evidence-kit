# Copy to .github/workflows/evidence.yml in your repository.
#
# Replace both <FULL_COMMIT_SHA_OF_v0.1.0> placeholders with the 40-character commit SHA
# of the release. Tags are mutable and are rejected by the workflow. Get the SHA with:
#
#   gh api repos/AIRCLOUD-PL/evidence-kit/commits/v0.1.0 --jq .sha
#   # or: git ls-remote https://github.com/AIRCLOUD-PL/evidence-kit 'refs/tags/v0.1.0^{}'
name: evidence

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # weekly: new CVEs appear without new commits
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  evidence:
    uses: AIRCLOUD-PL/evidence-kit/.github/workflows/evidence.yml@<FULL_COMMIT_SHA_OF_v0.1.0> # v0.1.0
    permissions:
      contents: read
      actions: read
    with:
      kit-ref: <FULL_COMMIT_SHA_OF_v0.1.0> # the same SHA as in `uses:`
      # vex-file: .vex/openvex.json   # optional: suppress triaged "not affected" CVEs (justified)
      # fail-on: high                 # optional: fail on HIGH/CRITICAL (default: report only)
      # fail-on-secrets: true         # optional: fail when gitleaks finds secrets
      # lang: pl,en                   # optional: Polish report first in the job summary
      # harden-runner: true           # optional: StepSecurity egress audit (telemetry; paid for private repos)
