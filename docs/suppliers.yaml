    type: open-source-component
    criticality: medium
    data_access: internal
    contract_ref: MIT / Apache-2.0
    known_vulnerabilities_considered: pinned to commit SHA, Dependabot updates
    quality_assessment: widely used
    last_assessment: 2026-11-25
    exit_plan: n/a
