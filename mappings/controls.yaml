    pl: skuteczne postępowanie z podatnościami w okresie wsparcia
  CRA-13.17:
    cite: Art. 13(17)
    cite_pl: art. 13 ust. 17
    en: single point of contact for users, incl. vulnerability reporting
    pl: pojedynczy punkt kontaktowy dla użytkowników, w tym do zgłaszania podatności
  CRA-14:
    cite: Art. 14(1)-(4)
    cite_pl: art. 14 ust. 1-4
