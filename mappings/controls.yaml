# evidence-kit control mapping.
#
# Each control maps to provisions of:
#   - KSC: ustawa z dnia 5 lipca 2018 r. o krajowym systemie cyberbezpieczeństwa
#     (t.j. Dz.U. 2024 poz. 1077), as amended by the act of 23 January 2026,
#     Dz.U. 2026 poz. 252 (Polish NIS2 transposition, in force 2026-04-03).
#   - CRA: Regulation (EU) 2024/2847 (Cyber Resilience Act).
#   - OSPS: OpenSSF Open Source Project Security Baseline (cross-reference only).
#
# Citations were checked against the primary texts on 2026-11-25:
#   KSC art. 8 and art. 11 as worded by Dz.U. 2026 poz. 252 (art. 1 pkt 16 and 19),
#   CRA art. 13, art. 14 and Annex I (EUR-Lex / Publications Office, EN and PL).
#
# The mapping is INFORMATIVE: a control "supports" a provision; it never proves
# that an organisation fulfils it. See `disclaimer`.
#
# Field `status`: auto   = evaluated by the kit from machine-readable evidence,
#                 manual = a human must attach the evidence listed in `evidence`.
schema: evidence-kit/mapping/v1
version: "0.1.0"
updated: "2026-11-25"

disclaimer:
  en: >-
    Informative mapping only. This is not legal advice and not a certification.
    The statutory KSC audit (art. 15) is performed by an authorised auditor.
    Automated results show what was observed in the repository at one commit;
    they do not prove that an information security management system exists.
  pl: >-
    Mapowanie ma charakter wyłącznie informacyjny. To nie jest porada prawna ani
    certyfikacja; ustawowy audyt KSC (art. 15) wykonuje uprawniony audytor.
    Wyniki automatyczne pokazują stan repozytorium w jednym commicie i nie dowodzą
    istnienia systemu zarządzania bezpieczeństwem informacji.

sources:
  ksc:
    title:
      en: Polish Act on the National Cybersecurity System (KSC) as amended by Dz.U. 2026 poz. 252
      pl: Ustawa o krajowym systemie cyberbezpieczeństwa w brzmieniu nadanym ustawą z 23.01.2026 r. (Dz.U. 2026 poz. 252)
    url: https://eli.gov.pl/eli/DU/2026/252/ogl
    base_act_url: https://eli.gov.pl/eli/DU/2024/1077/ogl
  cra:
    title:
      en: Regulation (EU) 2024/2847 (Cyber Resilience Act)
      pl: Rozporządzenie (UE) 2024/2847 (akt o cyberodporności, CRA)
    url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
  cert_pl:
    title:
      en: CERT Polska, Good practices for software security management (CRA guide), May 2026
      pl: CERT Polska, Dobre praktyki zarządzania bezpieczeństwem oprogramowania (poradnik CRA), maj 2026
    url: https://cert.pl/uploads/docs/CERT_Polska_Dobre_praktyki_zarzadzania_bezpieczenstwem_oprogramowania.pdf
  osps:
    title:
      en: OpenSSF Open Source Project Security Baseline
      pl: OpenSSF Open Source Project Security Baseline
    url: https://baseline.openssf.org

