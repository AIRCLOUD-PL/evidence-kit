    pl: "zgłaszanie aktywnie wykorzystywanych podatności i poważnych incydentów przez pojedynczą platformę zgłaszania (24 h / 72 h / raport końcowy)"
  CRA-I.1.1:
    cite: Annex I, Part I(1)
    cite_pl: zał. I część I pkt 1
    en: appropriate level of cybersecurity based on the risks
    pl: odpowiedni poziom cyberbezpieczeństwa stosownie do ryzyka
  CRA-I.1.2a:
    cite: Annex I, Part I(2)(a)
    cite_pl: zał. I część I pkt 2 lit. a
    en: made available without known exploitable vulnerabilities
    pl: udostępniane bez znanych i możliwych do wykorzystania podatności
  CRA-I.1.2b:
    cite: Annex I, Part I(2)(b)
    cite_pl: zał. I część I pkt 2 lit. b
    en: secure by default configuration
    pl: bezpieczna konfiguracja domyślna
  CRA-I.1.2c:
    cite: Annex I, Part I(2)(c)
    cite_pl: zał. I część I pkt 2 lit. c
    en: vulnerabilities can be addressed through security updates
    pl: możliwość eliminowania podatności przez aktualizacje zabezpieczeń
  CRA-I.1.2d:
    cite: Annex I, Part I(2)(d)
    cite_pl: zał. I część I pkt 2 lit. d
    en: protection from unauthorised access
    pl: ochrona przed nieuprawnionym dostępem
  CRA-I.1.2e:
    cite: Annex I, Part I(2)(e)
    cite_pl: zał. I część I pkt 2 lit. e
    en: confidentiality of data, e.g. encryption at rest and in transit
    pl: poufność danych, np. szyfrowanie danych odłożonych i przesyłanych
  CRA-I.1.2f:
    cite: Annex I, Part I(2)(f)
    cite_pl: zał. I część I pkt 2 lit. f
    en: integrity of data, commands, programs and configuration
    pl: integralność danych, komend, programów i konfiguracji
  CRA-I.1.2h:
    cite: Annex I, Part I(2)(h)
    cite_pl: zał. I część I pkt 2 lit. h
    en: availability of essential functions, also after an incident
    pl: dostępność podstawowych funkcji, również po incydencie
  CRA-I.1.2j:
    cite: Annex I, Part I(2)(j)
    cite_pl: zał. I część I pkt 2 lit. j
    en: limited attack surface
    pl: ograniczona powierzchnia ataku
  CRA-I.1.2l:
    cite: Annex I, Part I(2)(l)
    cite_pl: zał. I część I pkt 2 lit. l
    en: security logging and monitoring of relevant internal activity
    pl: rejestrowanie i monitorowanie aktywności istotnej dla bezpieczeństwa
  CRA-I.2.1:
    cite: Annex I, Part II(1)
    cite_pl: zał. I część II pkt 1
    en: identify and document vulnerabilities and components, incl. an SBOM
    pl: identyfikowanie i dokumentowanie podatności i komponentów, w tym SBOM
  CRA-I.2.2:
    cite: Annex I, Part II(2)
    cite_pl: zał. I część II pkt 2
    en: address and remediate vulnerabilities without delay
    pl: bezzwłoczne reagowanie na podatności i ich eliminowanie
  CRA-I.2.3:
    cite: Annex I, Part II(3)
    cite_pl: zał. I część II pkt 3
    en: effective and regular security tests and reviews
    pl: skuteczne i regularne testy oraz przeglądy bezpieczeństwa
  CRA-I.2.4:
    cite: Annex I, Part II(4)
    cite_pl: zał. I część II pkt 4
    en: publicly disclose information about fixed vulnerabilities
    pl: publiczne ujawnianie informacji o naprawionych podatnościach
  CRA-I.2.5:
    cite: Annex I, Part II(5)
    cite_pl: zał. I część II pkt 5
    en: coordinated vulnerability disclosure policy
    pl: polityka skoordynowanego ujawniania podatności
  CRA-I.2.6:
    cite: Annex I, Part II(6)
    cite_pl: zał. I część II pkt 6
    en: facilitate sharing vulnerability information, incl. a contact address
    pl: ułatwianie wymiany informacji o podatnościach, w tym adres kontaktowy
  CRA-I.2.7:
    cite: Annex I, Part II(7)
    cite_pl: zał. I część II pkt 7
    en: secure distribution of updates
    pl: bezpieczna dystrybucja aktualizacji
  CRA-I.2.8:
    cite: Annex I, Part II(8)
    cite_pl: zał. I część II pkt 8
    en: disseminate security updates without delay, with advisory messages
    pl: bezzwłoczne rozpowszechnianie aktualizacji zabezpieczeń z komunikatami doradczymi

controls:
  # ===================== automated =====================
  - id: EK-SBOM
    status: auto
    check: sbom
    title:
      en: Software bill of materials (CycloneDX)
      pl: Wykaz komponentów oprogramowania (SBOM, CycloneDX)
    evidence: [sbom.cdx.json]
    ksc: [KSC-8.1.2e, KSC-8.1.2m, KSC-8.2]
    cra: [CRA-I.2.1, CRA-13.5]
    osps: [OSPS-QA-02.01, OSPS-QA-02.02]

  - id: EK-VULN
    status: auto
    check: vulnerabilities
    title:
      en: Known vulnerabilities in dependencies (SBOM scan, optional VEX)
      pl: Znane podatności w zależnościach (skan SBOM, opcjonalnie VEX)
    evidence: [vulnerabilities.trivy.json, sbom.cdx.json]
    params:
      fail_severities: [CRITICAL, HIGH]
      warn_severities: [MEDIUM, LOW, UNKNOWN]
    ksc: [KSC-8.1.3, KSC-8.1.5b, KSC-8.1.5d]
    cra: [CRA-I.1.2a, CRA-I.2.1, CRA-I.2.2]
    osps: [OSPS-VM-05.03, OSPS-VM-04.02]

  - id: EK-SECRETS
    status: auto
    check: secrets
    title:
      en: No secrets in git history (gitleaks)
      pl: Brak sekretów w historii git (gitleaks)
    evidence: [secrets.gitleaks.json]
    ksc: [KSC-8.1.2n, KSC-8.1.2j, KSC-8.1.5a]
    cra: [CRA-I.1.2d, CRA-I.1.2e]
    osps: [OSPS-BR-07.01]

  - id: EK-SCORECARD
    status: auto
    check: scorecard
    title:
      en: OpenSSF Scorecard (repository security practices)
      pl: OpenSSF Scorecard (praktyki bezpieczeństwa repozytorium)
    evidence: [scorecard.json]
    params:
      pass_min: 7.0
      warn_min: 4.0
    ksc: [KSC-8.1.2b, KSC-8.1.2h]
    cra: [CRA-I.2.3]
    osps: []

  - id: EK-SECURITY-POLICY
    status: auto
    check: security_policy
    title:
      en: Security policy with a reporting contact (SECURITY.md)
      pl: Polityka bezpieczeństwa z kontaktem do zgłoszeń (SECURITY.md)
    evidence: [repo-checks.json]
    ksc: [KSC-8.1.3, KSC-8.1.4]
    cra: [CRA-I.2.6, CRA-13.17]
    osps: [OSPS-VM-02.01, OSPS-VM-03.01]

  - id: EK-CVD
    status: auto
    check: cvd_policy
    title:
      en: Coordinated vulnerability disclosure (CVD) policy
      pl: Polityka skoordynowanego ujawniania podatności (CVD)
    evidence: [repo-checks.json]
    ksc: [KSC-8.1.3, KSC-8.1.5d]
    cra: [CRA-I.2.5, CRA-13.8]
    osps: [OSPS-VM-01.01]

  - id: EK-SECURITY-TXT
    status: auto
    check: security_txt
    title:
      en: security.txt (RFC 9116) with Contact and valid Expires
      pl: security.txt (RFC 9116) z polem Contact i ważnym Expires
    evidence: [repo-checks.json]
    ksc: [KSC-8.1.3]
    cra: [CRA-I.2.6, CRA-13.17]
    osps: []

  - id: EK-CODEOWNERS
    status: auto
    check: codeowners
    title:
      en: Code ownership defined (CODEOWNERS)
      pl: Określeni właściciele kodu (CODEOWNERS)
    evidence: [repo-checks.json]
    ksc: [KSC-8.1.2n, KSC-8.1.5c]
    cra: [CRA-I.1.2f]
    osps: []

  - id: EK-BRANCH-PROTECTION
    status: auto
    check: branch_protection
    title:
      en: Default branch protected (branch protection or ruleset)
      pl: Chroniona gałąź domyślna (ochrona gałęzi lub ruleset)
    evidence: [repo-checks.json]
    ksc: [KSC-8.1.5c, KSC-8.1.2n]
    cra: [CRA-I.1.2f, CRA-I.1.2d]
    osps: [OSPS-AC-03.01, OSPS-AC-03.02, OSPS-QA-07.01]

  - id: EK-DEP-UPDATES
    status: auto
    check: dependency_updates
    title:
      en: Automated dependency updates (Dependabot or Renovate)
      pl: Automatyczne aktualizacje zależności (Dependabot lub Renovate)
    evidence: [repo-checks.json]
    ksc: [KSC-8.1.5b]
    cra: [CRA-I.2.2]
    osps: []

  - id: EK-SUPPLIERS
    status: auto
    check: supplier_register
    title:
      en: Supplier register present (content needs human review)
      pl: Rejestr dostawców w repozytorium (treść wymaga oceny człowieka)
    evidence: [repo-checks.json]
    ksc: [KSC-8.1.2e, KSC-8.2]
    cra: [CRA-13.5]
    osps: []

  - id: EK-INCIDENT-RUNBOOK
    status: auto
    check: incident_runbook
    title:
      en: Incident and vulnerability reporting runbook present
      pl: Procedura zgłaszania incydentów i podatności w repozytorium
    evidence: [repo-checks.json]
    ksc: [KSC-8.1.4, KSC-11.1.4]
    cra: [CRA-14]
    osps: []

  # ===================== manual =====================
  - id: M-RISK
    status: manual
    title:
      en: Risk assessment and risk treatment
      pl: Szacowanie ryzyka i postępowanie z ryzykiem
    evidence:
      en: Current risk register and method, product risk assessment (CRA), management approval.
      pl: Aktualny rejestr ryzyk i metodyka, ocena ryzyka produktu (CRA), akceptacja kierownictwa.
    ksc: [KSC-8.1.1, KSC-8.1.2a]
    cra: [CRA-13.2, CRA-I.1.1]

  - id: M-BCP
    status: manual
    title:
      en: Business continuity, backups and recovery
      pl: Ciągłość działania, kopie zapasowe i odtwarzanie
    evidence:
      en: BCP/DRP, backup policy, results of the last restore test.
      pl: Plan ciągłości działania i odtwarzania, polityka kopii, wynik ostatniego testu odtworzenia.
    ksc: [KSC-8.1.2f]
    cra: [CRA-I.1.2h]

  - id: M-CRYPTO
    status: manual
    title:
      en: Cryptography and encryption policy
      pl: Polityka kryptografii i szyfrowania
    evidence:
      en: Crypto policy (algorithms, key management), TLS and at-rest encryption configuration.
      pl: Polityka kryptograficzna (algorytmy, zarządzanie kluczami), konfiguracja TLS i szyfrowania danych.
    ksc: [KSC-8.1.2k]
    cra: [CRA-I.1.2e]

  - id: M-ACCESS
    status: manual
    title:
      en: Access control, MFA and physical security
      pl: Kontrola dostępu, MFA i bezpieczeństwo fizyczne
    evidence:
      en: Access control policy, MFA enforcement (e.g. GitHub org setting), periodic access reviews.
      pl: Polityka kontroli dostępu, wymuszenie MFA (np. ustawienie organizacji GitHub), okresowe przeglądy uprawnień.
    ksc: [KSC-8.1.2c, KSC-8.1.2l, KSC-8.1.2n]
    cra: [CRA-I.1.2d]

  - id: M-PEOPLE
    status: manual
    title:
      en: Staff security, training and cyber hygiene
      pl: Bezpieczeństwo personelu, szkolenia i cyberhigiena
    evidence:
      en: Training records for staff and the annual training of the manager (art. 8e), onboarding/offboarding procedure.
      pl: Ewidencja szkoleń personelu i corocznego szkolenia kierownika (art. 8e), procedura przyjęcia i odejścia pracownika.
    ksc: [KSC-8.1.2d, KSC-8.1.2i, KSC-8.1.2j, KSC-8e]
    cra: []

  - id: M-MONITORING
    status: manual
    title:
      en: Continuous monitoring and incident handling
      pl: Monitorowanie w trybie ciągłym i obsługa incydentów
    evidence:
      en: Monitoring/SIEM scope, alerting, incident register, a tested reporting exercise.
      pl: Zakres monitorowania (SIEM), alarmowanie, rejestr incydentów, przećwiczone zgłoszenie.
    ksc: [KSC-8.1.2g, KSC-8.1.4]
    cra: [CRA-I.1.2l]

  - id: M-ASSETS
    status: manual
    title:
      en: Asset inventory
      pl: Inwentaryzacja aktywów
    evidence:
      en: Inventory of systems, services and repositories in scope, with owners.
      pl: Wykaz systemów, usług i repozytoriów objętych zakresem, z właścicielami.
    ksc: [KSC-8.1.2m]
    cra: []

  - id: M-UPDATES
    status: manual
    title:
      en: Security update delivery, advisories and support period
      pl: Dostarczanie aktualizacji zabezpieczeń, komunikaty i okres wsparcia
    evidence:
      en: Release process (signed releases), published advisories for fixed vulnerabilities, declared support period.
      pl: Proces wydań (podpisane wydania), publikowane komunikaty o naprawionych podatnościach, zadeklarowany okres wsparcia.
    ksc: [KSC-8.1.5b]
