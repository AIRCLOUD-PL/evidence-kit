    pl: audyt bezpieczeństwa systemu informacyjnego co najmniej raz na 3 lata (podmioty kluczowe)

  # --- CRA (EU regulation) ----------------------------------------------------
  CRA-13.2:
    cite: Art. 13(2)-(3)
    cite_pl: art. 13 ust. 2-3
    en: documented cybersecurity risk assessment of the product
    pl: udokumentowana ocena ryzyka w cyberprzestrzeni dla produktu
  CRA-13.5:
    cite: Art. 13(5)
    cite_pl: art. 13 ust. 5
    en: due diligence when integrating third-party components, incl. open source
    pl: należyta staranność przy integrowaniu komponentów stron trzecich, w tym open source
  CRA-13.8:
    cite: Art. 13(8)
    cite_pl: art. 13 ust. 8
