  KSC-8.1.5c:
    cite: art. 8 ust. 1 pkt 5 lit. c
    en: protection against unauthorised modification
    pl: ochrona przed nieuprawnioną modyfikacją w systemie informacyjnym
  KSC-8.1.5d:
    cite: art. 8 ust. 1 pkt 5 lit. d
