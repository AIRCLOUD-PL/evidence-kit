    pl: polityki szacowania ryzyka i bezpieczeństwa systemu informacyjnego, w tym polityki tematyczne
  KSC-8.1.2b:
    cite: art. 8 ust. 1 pkt 2 lit. b
    en: security in acquisition, development, maintenance and operation, incl. testing
    pl: bezpieczeństwo w procesie nabywania, rozwoju, utrzymania i eksploatacji, w tym testowanie
  KSC-8.1.2c:
    cite: art. 8 ust. 1 pkt 2 lit. c
    en: physical and environmental security, incl. access control
    pl: bezpieczeństwo fizyczne i środowiskowe uwzględniające kontrolę dostępu
  KSC-8.1.2d:
    cite: art. 8 ust. 1 pkt 2 lit. d
