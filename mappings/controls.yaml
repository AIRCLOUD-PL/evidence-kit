  KSC-8.1.2j:
    cite: art. 8 ust. 1 pkt 2 lit. j
    en: basic cyber hygiene
    pl: podstawowe zasady cyberhigieny
  KSC-8.1.2k:
    cite: art. 8 ust. 1 pkt 2 lit. k
    en: policies and procedures for cryptography, incl. encryption where appropriate
    pl: polityki i procedury stosowania kryptografii, w tym szyfrowania
  KSC-8.1.2l:
    cite: art. 8 ust. 1 pkt 2 lit. l
    en: secure electronic communication, incl. multi-factor authentication where appropriate
    pl: bezpieczne środki komunikacji elektronicznej, w tym uwierzytelnianie wieloskładnikowe
  KSC-8.1.2m:
    cite: art. 8 ust. 1 pkt 2 lit. m
    en: asset management
    pl: zarządzanie aktywami
  KSC-8.1.2n:
    cite: art. 8 ust. 1 pkt 2 lit. n
    en: access control policies
    pl: polityki kontroli dostępu
  KSC-8.1.3:
    cite: art. 8 ust. 1 pkt 3
    en: collecting information on cyber threats and vulnerabilities
    pl: zbieranie informacji o cyberzagrożeniach i podatnościach
  KSC-8.1.4:
    cite: art. 8 ust. 1 pkt 4
    en: incident management
