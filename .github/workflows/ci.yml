name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dev dependencies (hash-pinned)
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-dev.txt

      - name: Ruff lint
        run: .venv/bin/ruff check --output-format=github .

      - name: Ruff format check
        run: .venv/bin/ruff format --check .

      # -P keeps the working directory off sys.path (same as in evidence.yml);
      # the kit itself is imported via an explicit PYTHONPATH.
      - name: Validate mapping
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: .venv/bin/python -P -m evidence_kit validate mappings/controls.yaml

      # Includes the isolation test: a malicious evidence_kit/ in the scanned repository
      # must not replace the kit's gate (tests/test_isolation.py).
      - name: pytest
        run: .venv/bin/pytest

      - name: zizmor (GitHub Actions security audit)
        run: .venv/bin/zizmor --offline .github/workflows

      - name: Install actionlint (checksum-verified)
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" actionlint

      - name: actionlint
        run: |
          "${RUNNER_TEMP}/actionlint" -color .github/workflows/*.yml
