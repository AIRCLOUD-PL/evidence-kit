# pip: Dependabot resolves with the Python from .python-version (3.12, the same
# as ubuntu-24.04 runners and the `uv pip compile --python-version 3.12` lock).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
