# pip: Dependabot resolves with the lowest Python allowed by requires-python in
# pyproject.toml (>=3.11); the hash-locked dev tools need >= 3.11.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
