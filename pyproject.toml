[project]
name = "evidence-kit"
version = "0.1.0"
description = "Supply-chain security evidence (SBOM, vulnerabilities, secrets, Scorecard) mapped to KSC (NIS2 PL) and the EU Cyber Resilience Act."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]
authors = [{ name = "AIRCLOUD", email = "office@aircloud.com.pl" }]

[project.urls]
Homepage = "https://aircloud.com.pl"
Source = "https://github.com/AIRCLOUD-PL/evidence-kit"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".specify", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"] # assert is used in tests and for internal invariants

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
